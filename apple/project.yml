# Plajah for Mac + Apple TV — XcodeGen spec (brew install xcodegen; xcodegen generate).
# iPhone + iPad live in ../ios (Capacitor). See README.md.
name: Plajah
options:
  bundleIdPrefix: com.plajah
  deploymentTarget:
    macOS: "13.0"
    tvOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # set your Apple team ID (or pass DEVELOPMENT_TEAM=... to xcodebuild)
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  PlajahMac:
    type: application
    platform: macOS
    sources:
      - path: Mac
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared
      - path: ../cap-shell/offline.html
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Mac/Info.plist
        CODE_SIGN_ENTITLEMENTS: Mac/Plajah.entitlements
        PRODUCT_NAME: Plajah
        PRODUCT_BUNDLE_IDENTIFIER: com.plajah.app   # one App Store record across iPhone/iPad/Mac/TV
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
  PlajahTV:
    type: application
    platform: tvOS
    sources:
      - path: TV
        excludes: ["Info.plist"]
      - path: Shared
    settings:
      base:
        INFOPLIST_FILE: TV/Info.plist
        PRODUCT_NAME: Plajah
        PRODUCT_BUNDLE_IDENTIFIER: com.plajah.app
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        TARGETED_DEVICE_FAMILY: "3"
schemes:
  PlajahMac:
    build: { targets: { PlajahMac: all } }
    run: { config: Debug }
    archive: { config: Release }
  PlajahTV:
    build: { targets: { PlajahTV: all } }
    run: { config: Debug }
    archive: { config: Release }

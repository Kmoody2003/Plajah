[package]
name = "fabula-ofx"
version = "0.1.0"
edition = "2021"
description = "OpenFX 1.4 shell for the Fabula Forge effect registry. Dependency-free: src/manifest_gen.rs (generated by `npm run ofx:manifest`) carries one OFX plugin per Forge effect/transition — identifier, grouping, contexts, clips, typed params — plus each effect's GLSL passes and param ABI. Step 1: describe + passthrough render (this crate). Step 2: wgpu execution of the passes."
license = "UNLICENSED"

[lib]
crate-type = ["cdylib", "rlib"]
name = "fabula_ofx"

[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[package]
name = "plajah-vst3-host"
version = "0.1.0"
edition = "2024"
description = "Crash-isolated VST3 host worker for Plajah Windows"
license = "UNLICENSED"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vst3-host = { version = "0.9.0", default-features = false, features = ["process-isolation"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

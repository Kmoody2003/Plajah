[package]
name = "plajah-8bf-host"
version = "0.1.0"
edition = "2024"
description = "Crash-isolated Photoshop filter (.8bf) host worker for Plajah Windows"
license = "UNLICENSED"

# Standalone on purpose: this crate is not a member of rust/Cargo.toml. The empty
# table stops Cargo from looking for a parent workspace.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }

# Test filter: build with `cargo build --release --example testfilter`, then copy the
# resulting DLL to a .8bf. It has no PiPL, so tests pass `entry: "PluginMain"`.
[[example]]
name = "testfilter"
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

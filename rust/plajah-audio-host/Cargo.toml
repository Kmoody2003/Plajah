[package]
name = "plajah-audio-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native multi-core render pool for plajah-audio: one engine per track, rendered in parallel and mixed. Phase 1 of docs/CHORA_GPU_AUDIO_SCOPE.md: WASAPI output and render-ahead, not yet connected to the app."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
plajah-audio = { path = "../plajah-audio" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Variant", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem"] }

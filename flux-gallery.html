<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flux — The Council Collection</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b10;color:#eee8dc;font:14px system-ui,sans-serif}button,input,label{font:inherit}button{color:inherit;cursor:pointer}header{height:86px;padding:20px 4vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #262a2d}.brand{font-size:25px;letter-spacing:7px;font-weight:300}.edition{font-size:10px;color:#9c9d9c;letter-spacing:2px;text-transform:uppercase}.stage{position:relative;margin:24px 4vw 0;background:#04060a;aspect-ratio:16/9;max-height:68vh;overflow:hidden;border:1px solid #282d31}canvas{width:100%;height:100%;display:block;object-fit:contain}.caption{position:absolute;left:28px;bottom:24px;pointer-events:none;text-shadow:0 2px 14px #000}.caption small{letter-spacing:3px;color:#c3aa83;font-size:10px}.caption h1{font:300 clamp(24px,3vw,44px) Georgia,serif;margin:8px 0 0}.status{position:absolute;top:18px;right:18px;color:#b2b9bd;background:#0b101abb;padding:8px 12px;font-size:10px;letter-spacing:1px;border-radius:3px}.details{margin:18px 4vw;display:flex;justify-content:space-between;gap:20px;align-items:center}.details p{max-width:600px;color:#a9afb4;line-height:1.6;margin:0}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.controls button,.upload{border:1px solid #353b42;background:#10151d;padding:10px 13px;border-radius:4px;cursor:pointer}.controls button[aria-pressed=true]{border-color:#c4a475;color:#f0d0a2}.collection{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 4vw}.tile{background:#10151b;border:1px solid #262e36;padding:18px;text-align:left;min-height:116px;transition:background .2s}.tile[aria-selected=true]{background:#20221f;border-color:#a68d65}.tile .n{color:#a88f69;font-size:10px;letter-spacing:2px}.tile strong{display:block;font:400 21px Georgia,serif;margin:10px 0}.tile span:last-child{font-size:11px;color:#9da8b0}footer{margin:24px 4vw 32px;color:#737e88;font-size:11px;display:flex;justify-content:space-between;gap:24px}a{color:#bba17c}.error{position:absolute;inset:0;display:grid;place-items:center;color:#f6be9a;padding:30px}input[type=file]{display:none}@media(max-width:700px){header{height:72px}.edition{max-width:160px;text-align:right}.stage{margin-top:14px;max-height:none}.caption{left:14px;bottom:12px}.status{top:8px;right:8px;font-size:8px}.details{display:block}.controls{margin-top:14px}.collection{grid-template-columns:repeat(2,1fr)}footer{display:block}}

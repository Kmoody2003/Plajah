<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vesselbound — 3D Asset, Rig &amp; Animation Inspector</title>
  <style>
    :root {
      --bg: #0b0e14;
      --panel: #121722e8;
      --border: #ffffff18;
      --accent: #38bdf8;
      --accent-glow: #38bdf833;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
    #viewport { position: fixed; inset: 0; }
    #viewport canvas { display: block; width: 100%; height: 100%; }

    #sidebar {
      position: fixed; left: 12px; top: 12px; bottom: 12px; width: 290px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      backdrop-filter: blur(12px); display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 12px 32px #00000066; z-index: 10;
    }
    .sb-head { padding: 12px 14px 10px; border-bottom: 1px solid var(--border); }
    .sb-title { font-size: 14px; font-weight: 700; letter-spacing: 0.04em; color: #f8fafc; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; }
    .sb-badge { font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-glow); padding: 2px 7px; border-radius: 999px; }
    #search {
      width: 100%; padding: 6px 10px; border-radius: 7px; border: 1px solid var(--border);
      background: #0a0d14; color: var(--text); font-size: 12px; outline: none;
    }
    #search:focus { border-color: var(--accent); }
    .cats { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .cat-btn {
      background: #1b2232; color: var(--muted); border: 1px solid transparent; border-radius: 6px;
      padding: 3px 7px; font-size: 11px; cursor: pointer; font-weight: 600;
    }
    .cat-btn:hover { color: #fff; }
    .cat-btn.on { background: var(--accent-glow); color: var(--accent); border-color: var(--accent); }
    #roster-list { flex: 1; overflow-y: auto; padding: 6px; }
    .item {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      width: 100%; text-align: left; background: transparent; border: 1px solid transparent;
      color: var(--text); padding: 7px 9px; border-radius: 7px; cursor: pointer; margin-bottom: 2px;
    }
    .item:hover { background: #ffffff0c; }
    .item.on { background: var(--accent-glow); border-color: #38bdf866; color: #fff; }
    .item-name { font-weight: 600; font-size: 12.5px; }
    .item-sub { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }

    #inspector {
      position: fixed; right: 12px; top: 12px; bottom: 12px; width: 295px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      backdrop-filter: blur(12px); display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 12px 32px #00000066; z-index: 10;
    }
    .sec { padding: 11px 14px; border-bottom: 1px solid var(--border); }
    .sec h3 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
    .row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
    .btn {
      background: #1c2436; color: var(--text); border: 1px solid var(--border); border-radius: 6px;
      padding: 4px 9px; font-size: 11.5px; cursor: pointer; font-weight: 600;
    }
    .btn:hover { background: #263149; }
    .btn.on { background: var(--accent); color: #06121f; border-color: var(--accent); }
    .slider-row { display: flex; align-items: center; gap: 8px; margin-top: 7px; font-size: 11.5px; color: var(--muted); }
    .slider-row input[type=range] { flex: 1; accent-color: var(--accent); }
    #clip-list { flex: 1; overflow-y: auto; padding: 8px 12px 12px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 5px; }
    .clip-btn {
      background: #171e2d; color: #cbd5e1; border: 1px solid var(--border); border-radius: 6px;
      padding: 4px 8px; font-size: 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
    }
    .clip-btn:hover { border-color: var(--accent); color: #fff; }
    .clip-btn.on { background: var(--accent); color: #04111d; border-color: var(--accent); font-weight: 700; }
    .clip-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .clip-dot.good { background: #34d399; }
    .clip-dot.usable { background: #fbbf24; }
    .clip-dot.poor { background: #f87171; }
    .clip-btn.on .clip-dot { background: #04111d; }

    #hud {
      position: fixed; left: 316px; right: 320px; bottom: 12px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      padding: 9px 14px; display: flex; align-items: center; justify-content: space-between; gap: 14px;
      backdrop-filter: blur(10px); z-index: 10; font-size: 12px;
    }
    #hud-meta { color: var(--muted); font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; }
    #loading {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      background: #0d1320ee; border: 1px solid #38bdf866; border-radius: 10px;
      padding: 12px 22px; font-weight: 600; letter-spacing: 0.08em; color: var(--accent);
      pointer-events: none; z-index: 20; display: none;
    }
  </style>
</head>
<body>
  <div id="viewport"></div>
  <div id="loading">LOADING MODEL…</div>

  <aside id="sidebar">
    <div class="sb-head">
      <div class="sb-title">
        <span>VESSELBOUND ASSET LAB</span>
        <span class="sb-badge" id="count-badge">139</span>
      </div>
      <input id="search" type="search" placeholder="Search all 3D models…" autocomplete="off" />
      <div class="cats" id="cats"></div>
    </div>
    <div id="roster-list"></div>
  </aside>

  <aside id="inspector">
    <div class="sec">
      <h3>Camera &amp; Display</h3>
      <div class="row">
        <button class="btn" data-cam="three">3/4 Hero</button>
        <button class="btn" data-cam="front">Front</button>
        <button class="btn" data-cam="side">Side</button>
        <button class="btn" data-cam="back">Back</button>
        <button class="btn" id="btn-spin">Turntable</button>
      </div>
      <div class="row" style="margin-top:6px;">
        <button class="btn" id="btn-bones">Bones</button>
        <button class="btn" id="btn-wire">Wireframe</button>
        <button class="btn on" id="btn-grid">Grid</button>
        <button class="btn on" id="btn-tex" title="Toggle between lossless source WebP GLB and GPU KTX2 GLB">HQ Source</button>
      </div>
      <div class="slider-row">
        <span>Glow</span>
        <input id="glow-slider" type="range" min="0" max="2.5" step="0.1" value="1.2" />
        <span id="glow-val">1.2×</span>
      </div>
    </div>

    <div class="sec">
      <h3>Socket Gear &amp; Modular Armor</h3>
      <div class="slider-row" style="margin-top:0;">
        <span style="min-width:46px;">R-Hand</span>
        <select id="equip-right" style="flex:1;background:#0a0d14;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 6px;font-size:11.5px;">
          <option value="">None (Unarmed)</option>
        </select>
      </div>
      <div class="slider-row" style="margin-top:5px;">
        <span style="min-width:46px;">L-Arm</span>
        <select id="equip-left" style="flex:1;background:#0a0d14;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 6px;font-size:11.5px;">
          <option value="">None</option>
        </select>
      </div>
      <div class="slider-row" style="margin-top:5px;">
        <span style="min-width:46px;">Armor</span>
        <select id="equip-armor" style="flex:1;background:#0a0d14;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 6px;font-size:11.5px;">
          <option value="">None (Base Body)</option>
        </select>
      </div>
    </div>

    <div class="sec">
      <h3>Playback</h3>
      <div class="row">
        <button class="btn on" id="btn-play">Pause</button>
        <button class="btn" id="btn-bind">Bind Pose</button>
        <span id="time-label" style="margin-left:auto;font-family:monospace;color:var(--muted);">0.00s</span>
      </div>
      <div class="slider-row">
        <input id="scrub" type="range" min="0" max="1" step="0.002" value="0" />
      </div>
      <div class="slider-row">
        <span>Speed</span>
        <input id="speed-slider" type="range" min="0.1" max="2.0" step="0.05" value="1.0" />
        <span id="speed-val">1.00×</span>
      </div>
    </div>

    <div class="sec" style="border-bottom:none;padding-bottom:4px;display:flex;align-items:center;justify-content:space-between;">
      <h3 id="clips-heading" style="margin:0;">Animation Clips (0)</h3>
      <button class="btn on" id="btn-clean-clips" style="padding:2px 7px;font-size:10.5px;" title="Hide poor-grade video mocap solves">Clean Only</button>
    </div>
    <div id="clip-list"></div>
  </aside>

  <div id="hud">
    <div><strong id="hud-name">—</strong> <span id="hud-cat" style="color:var(--accent);margin-left:6px;"></span></div>
    <div id="hud-meta">Drag: orbit · Scroll: zoom · Right-drag: pan</div>
  </div>

  <script type="module" src="./src/rigViewerMain.ts"></script>
</body>
</html>

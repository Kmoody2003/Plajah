<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Plajah is offline</title>
  <style>
    html,body{margin:0;height:100%;background:#04030a;color:#fff;font:500 16px system-ui,sans-serif}
    body{display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
    h1{font-size:22px;margin:0 0 8px}p{opacity:.7;margin:0 0 24px}
    button{background:#ff8c00;color:#111;border:0;border-radius:12px;padding:12px 28px;font:700 15px system-ui,sans-serif}
  </style>
</head>
<body>
  <div>
    <h1>Can't reach Plajah</h1>
    <p>Check your connection, then try again.</p>
    <button onclick="location.replace('https://plajah.com')">Retry</button>
  </div>
</body>
</html>

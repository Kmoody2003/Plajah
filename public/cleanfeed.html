<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plajah Studio — Clean Feed Monitor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100vh;
      background: #000000;
      color: #ffffff;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    #viewport-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    video, img, canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    .hud {
      position: absolute;
      top: 16px;
      left: 16px;
      padding: 6px 12px;
      background: rgba(12, 13, 18, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      font-size: 11px;
      font-family: ui-monospace, "SF Mono", "Cascadia Code", monospace;
      letter-spacing: 0.08em;
      color: #00e5ff;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
    .hud.fade { opacity: 0; }
    .status-badge {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00e676;
      margin-right: 8px;
      box-shadow: 0 0 8px #00e676;
    }
    .watermark {
      position: absolute;
      bottom: 16px;
      right: 16px;
      font-size: 10px;
      letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.25);
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="viewport-container">
    <video id="clean-video" style="display: none;" playsinline muted></video>
    <canvas id="clean-canvas" width="1920" height="1080"></canvas>
    <div id="hud" class="hud">
      <span class="status-badge"></span>
      <span id="hud-text">STUDIO CLEAN FEED · 10-BIT DIRECT3D</span>
    </div>
    <div class="watermark">Fabula Studio Engine</div>
  </div>

  <script>
    const channel = new BroadcastChannel('plajah_studio_cleanfeed');
    const hud = document.getElementById('hud');
    const hudText = document.getElementById('hud-text');
    const canvas = document.getElementById('clean-canvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('clean-video');

    // Auto-fade HUD after 3 seconds of connection
    setTimeout(() => {
      hud.classList.add('fade');
    }, 4000);

    window.addEventListener('mousemove', () => {
      hud.classList.remove('fade');
      clearTimeout(window.hudTimer);
      window.hudTimer = setTimeout(() => hud.classList.add('fade'), 2500);
    });

    channel.onmessage = (event) => {
      const msg = event.data;
      if (!msg) return;

      if (msg.type === 'FRAME_DATA' && msg.imageBitmap) {
        if (canvas.width !== msg.width || canvas.height !== msg.height) {
          canvas.width = msg.width;
          canvas.height = msg.height;
        }
        ctx.drawImage(msg.imageBitmap, 0, 0);
      } else if (msg.type === 'FEED_STATUS') {
        hudText.textContent = msg.statusText || 'CLEAN FEED ACTIVE';
      }
    };
  </script>
</body>
</html>

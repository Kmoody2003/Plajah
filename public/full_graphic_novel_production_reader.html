<head>

  <title>Plajah Full-Book Studio: The Obsidian Shroud & Chrome Apostle (20 Pages Each)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: #0d111a;
      --card-border: #1e2638;
      --cyan: #00daf3;
      --amber: #f59e0b;
      --red: #ef4444;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      padding: 20px;
      line-height: 1.5;
    }
    .top-bar {
      max-width: 1400px;
      margin: 0 auto 20px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 24px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--cyan), #3b82f6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #000;
      font-size: 16px;
    }
    .brand h1 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .book-btn {
      background: #141a29;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .book-btn.active.amber {
      background: var(--amber);
      color: #000;
      border-color: var(--amber);
    }
    .book-btn.active.cyan {
      background: var(--cyan);
      color: #000;
      border-color: var(--cyan);
    }

    .view-btn {
      background: #141a29;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .view-btn.active {
      background: #252e42;
      color: #fff;
    }

    /* Page Navigation Bar */
    .nav-bar {
      max-width: 1400px;
      margin: 0 auto 20px auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #090c13;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 18px;
    }
    .nav-btn {
      background: #141926;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .page-indicator {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      color: var(--cyan);
    }
    .page-title-banner {
      color: var(--text-muted);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Thumbnail Strip */
    .thumb-strip {
      max-width: 1400px;
      margin: 0 auto 24px auto;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
    }
    .thumb-strip::-webkit-scrollbar {
      height: 6px;
    }
    .thumb-strip::-webkit-scrollbar-thumb {
      background: #1e2638;
      border-radius: 3px;
    }
    .thumb-btn {
      flex: 0 0 56px;
      height: 72px;
      background: #10141f;
      border: 2px solid #1a2233;
      border-radius: 6px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .thumb-btn:hover {
      border-color: var(--cyan);
      color: #fff;
    }
    .thumb-btn.active {
      border-color: var(--amber);
      background: #191f2e;
      color: var(--amber);
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
    }
    .thumb-btn.active.cyan {
      border-color: var(--cyan);
      color: var(--cyan);
      box-shadow: 0 0 10px rgba(0, 218, 243, 0.3);
    }

    /* Reader Main Display */
    .reader-stage {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
    }
    .comic-page-sheet {
      width: 100%;
      background: #000000;
      border: 4px solid #181d29;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .panels-container {
      display: grid;
      gap: 16px;
      width: 100%;
    }
    .panels-container.count-1 { grid-template-columns: 1fr; }
    .panels-container.count-2 { grid-template-columns: 1fr; }
    .panels-container.count-3 { grid-template-columns: 1fr 1fr; }
    .panels-container.count-4 { grid-template-columns: 1fr 1fr; }

    .comic-panel-box {
      position: relative;
      background: #0b0e14;
      border: 3.5px solid #000000;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .comic-panel-box.full-bleed {
      grid-column: span 2;
    }
    .panel-media-wrap {
      position: relative;
      width: 100%;
      min-height: 380px;
      background: #080a0f;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .panel-media-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Tela Vector Overlays */
    .tela-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .caption-card {
      position: absolute;
      background: #000000;
      border: 2px solid var(--amber);
      color: var(--amber);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 2px;
      max-width: 80%;
      letter-spacing: 0.5px;
      box-shadow: 2px 3px 0 rgba(0,0,0,0.8);
      white-space: pre-line;
    }
    .caption-card.manga {
      background: #ffffff;
      border: 2px solid #000000;
      color: #000000;
      font-family: 'Inter', sans-serif;
      font-weight: 800;
    }
    .dialogue-balloon {
      position: absolute;
      background: #ffffff;
      border: 2.5px solid #000000;
      color: #0f172a;
      font-family: 'Comic Neue', sans-serif;
      font-weight: 700;
      font-size: 13.5px;
      padding: 10px 16px;
      border-radius: 18px;
      max-width: 260px;
      text-align: center;
      line-height: 1.25;
      box-shadow: 2px 3px 6px rgba(0,0,0,0.4);
    }
    .dialogue-balloon.shout {
      border: 3px solid var(--red);
      color: var(--red);
      font-family: 'Inter', sans-serif;
      font-weight: 900;
      text-transform: uppercase;
    }
    .dialogue-balloon.comms {
      background: #0f172a;
      border: 2px solid var(--cyan);
      color: var(--cyan);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      border-radius: 4px;
    }
    .kinetic-sfx {
      position: absolute;
      font-family: 'Bangers', cursive;
      font-size: 42px;
      color: var(--cyan);
      text-shadow: 0 0 12px rgba(0, 218, 243, 0.8);
      -webkit-text-stroke: 2.5px #000000;
      transform: rotate(-8deg);
      letter-spacing: 2px;
    }
    .kinetic-sfx.orange {
      color: var(--amber);
      text-shadow: 0 0 12px rgba(245, 158, 11, 0.8);
    }
    .kinetic-sfx.red {
      color: var(--red);
      text-shadow: 0 0 12px rgba(239, 68, 68, 0.8);
    }

    .panel-footer-meta {
      background: #090c12;
      border-top: 2px solid #000000;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }
    .page-footer-folio {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #64748b;
      font-family: 'JetBrains Mono', monospace;
      padding-top: 12px;
      border-top: 1px solid #1e2638;
    }

    /* Fallback procedural drawing canvas when generating */
    .procedural-art {
      width: 100%;
      height: 100%;
      min-height: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #171d2b 0%, #090c13 100%);
      color: #94a3b8;
      text-align: center;
      padding: 24px;
    }
  </style>

    let currentBookId = 'obsidian';
    let currentPageIndex = 0; // 0 to 19

    function selectBook(id) {
      currentBookId = id;
      currentPageIndex = 0;
      
      document.getElementById('btn-obsidian').classList.remove('active', 'amber');
      document.getElementById('btn-chrome').classList.remove('active', 'cyan');

      if (id === 'obsidian') {
        document.getElementById('btn-obsidian').classList.add('active', 'amber');
      } else {
        document.getElementById('btn-chrome').classList.add('active', 'cyan');
      }

      buildThumbStrip();
      renderCurrentPage();
    }

    function buildThumbStrip() {
      const book = BOOKS[currentBookId];
      const strip = document.getElementById('thumb-strip');
      strip.innerHTML = '';

      book.pages.forEach((page, idx) => {
        const btn = document.createElement('button');
        btn.className = 'thumb-btn' + (idx === currentPageIndex ? (' active ' + (currentBookId === 'obsidian' ? 'amber' : 'cyan')) : '');
        btn.innerHTML = '<span>P' + page.pageNumber + '</span><span style="font-size:9px;opacity:0.6;">' + page.panels.length + 'p</span>';
        btn.onclick = () => {
          currentPageIndex = idx;
          updateThumbActive();
          renderCurrentPage();
        };
        strip.appendChild(btn);
      });
    }

    function updateThumbActive() {
      const btns = document.querySelectorAll('.thumb-btn');
      btns.forEach((btn, idx) => {
        btn.className = 'thumb-btn' + (idx === currentPageIndex ? (' active ' + (currentBookId === 'obsidian' ? 'amber' : 'cyan')) : '');
      });
    }

    function changePage(delta) {
      const book = BOOKS[currentBookId];
      const newIdx = currentPageIndex + delta;
      if (newIdx >= 0 && newIdx < book.pages.length) {
        currentPageIndex = newIdx;
        updateThumbActive();
        renderCurrentPage();
      }
    }

    function renderCurrentPage() {
      const book = BOOKS[currentBookId];
      const page = book.pages[currentPageIndex];
      const overlayOn = document.getElementById('toggle-overlay').checked;

      // Update Nav
      document.getElementById('page-indicator').textContent = 'PAGE ' + page.pageNumber + ' / ' + book.pages.length;
      document.getElementById('page-title-banner').textContent = page.act + ': ' + page.title;
      document.getElementById('btn-prev').disabled = currentPageIndex === 0;
      document.getElementById('btn-next').disabled = currentPageIndex === book.pages.length - 1;

      // Update Folio
      const isManga = currentBookId === 'chrome';
      document.getElementById('folio-left').textContent = isManga ? '◄ READ RIGHT TO LEFT' : '◄ READ LEFT TO RIGHT';
      document.getElementById('folio-center').textContent = 'PAGE ' + page.pageNumber + ' · ' + book.title.toUpperCase();
      document.getElementById('folio-right').textContent = isManga ? 'SHONEN TANKŌBON' : 'NOIR GRAPHIC NOVEL';

      // Render Panels
      const container = document.getElementById('panels-container');
      container.className = 'panels-container count-' + Math.min(page.panels.length, 4);
      container.innerHTML = '';

      page.panels.forEach((panel) => {
        const isFullWidth = panel.geometry === 'widescreen-letterbox' || panel.geometry === 'open-bleed' || page.panels.length === 1;
        const panelBox = document.createElement('div');
        panelBox.className = 'comic-panel-box' + (isFullWidth ? ' full-bleed' : '');

        // Media Wrap
        const mediaWrap = document.createElement('div');
        mediaWrap.className = 'panel-media-wrap';
        
        // Image path
        const subfolder = currentBookId === 'obsidian' ? 'obsidian_full' : 'chrome_full';
        const imgPath = 'on_device_panels/' + subfolder + '/p' + page.pageNumber + '_pan' + panel.panelNumber + '.png';

        const img = document.createElement('img');
        img.className = 'panel-media-img';
        img.src = imgPath;
        img.alt = panel.artBrief;
        img.onerror = function() {
          // If on-device panel is currently finishing generation, display stylish procedural brief
          mediaWrap.innerHTML = '<div class="procedural-art">' +
            '<div style="font-family:monospace;font-size:11px;color:' + (currentBookId === 'obsidian' ? '#f59e0b' : '#00daf3') + ';font-weight:700;margin-bottom:8px;">ON-DEVICE GPU RENDERING / SCRIPT BEAT</div>' +
            '<div style="font-size:14px;font-weight:700;color:#f1f5f9;margin-bottom:6px;">[' + panel.cameraAngle.toUpperCase() + ']</div>' +
            '<div style="font-size:12px;max-width:85%;line-height:1.4;">"' + panel.artBrief + '"</div>' +
          '</div>';
          if (overlayOn) mediaWrap.appendChild(createOverlay(panel, isManga));
        };

        mediaWrap.appendChild(img);

        if (overlayOn) {
          mediaWrap.appendChild(createOverlay(panel, isManga));
        }

        panelBox.appendChild(mediaWrap);

        // Meta Footer
        const footer = document.createElement('div');
        footer.className = 'panel-footer-meta';
        footer.innerHTML = '<span>PANEL ' + panel.panelNumber + ' [' + panel.cameraAngle.toUpperCase() + ']</span>' +
          '<span>' + panel.eyeVector + '</span>';
        panelBox.appendChild(footer);

        container.appendChild(panelBox);
      });
    }

    function createOverlay(panel, isManga) {
      const overlay = document.createElement('div');
      overlay.className = 'tela-overlay';

      // Captions
      if (panel.captions) {
        panel.captions.forEach(c => {
          const card = document.createElement('div');
          card.className = 'caption-card' + (isManga ? ' manga' : '');
          card.textContent = c.text;
          applyPos(card, c.position);
          overlay.appendChild(card);
        });
      }

      // Speech Balloons
      if (panel.balloons) {
        panel.balloons.forEach(b => {
          const balloon = document.createElement('div');
          balloon.className = 'dialogue-balloon' + (b.style ? ' ' + b.style : '');
          balloon.textContent = b.text;
          applyPos(balloon, b.position);
          overlay.appendChild(balloon);
        });
      }

      // Kinetic SFX
      if (panel.sfx) {
        panel.sfx.forEach(s => {
          const sfx = document.createElement('div');
          const colorClass = s.style === 'orange-kinetic' ? ' orange' : (s.style === 'red-impact' ? ' red' : '');
          sfx.className = 'kinetic-sfx' + colorClass;
          sfx.textContent = s.word.toUpperCase();
          applyPos(sfx, s.position);
          overlay.appendChild(sfx);
        });
      }

      return overlay;
    }

    function applyPos(el, pos) {
      if (!pos) return;
      if (pos.top) el.style.top = pos.top;
      if (pos.bottom) el.style.bottom = pos.bottom;
      if (pos.left) el.style.left = pos.left;
      if (pos.right) el.style.right = pos.right;
      if (pos.maxWidth) el.style.maxWidth = pos.maxWidth;
    }

    // Initialize
    selectBook('obsidian');
  </script>

<!doctype html><html><head><meta charset="utf-8"><title>XR bench</title>
<style>body{background:#0D0B14;color:#ccc;font:12px/1.6 ui-monospace,monospace;padding:16px}
pre{white-space:pre-wrap}canvas{border:1px solid #333;margin:6px 6px 0 0;vertical-align:top}</style></head>
<body><pre id="out">running…</pre><div id="cv"></div>
<script type="module">
import { EYE_FRAG, HEADSET_DIM, QUAD_VERT, XR_COMFORT, fieldProgramSource, invViewProj } from '/services/ora/stillness/xrSession.ts';
import { createSession } from '/services/ora/stillness/emotionalEngine.ts';
import { StillnessDriverSampler } from '/components/plajahPixels/engine/stillnessDrivers.ts';
import { shaderForPhase } from '/components/plajahPixels/engine/presets/stillnessShaders.ts';
import { STILLNESS_SHADERS } from '/components/plajahPixels/engine/presets/stillnessShaders.ts';

const log = [];
const say = (s) => { log.push(s); document.getElementById('out').textContent = log.join('\n'); };

function compile(gl, type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function link(gl, v, f) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl, gl.VERTEX_SHADER, v));
  gl.attachShader(p, compile(gl, gl.FRAGMENT_SHADER, f));
  gl.bindAttribLocation(p, 0, 'p'); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}
function persp(fovY, aspect, near, far) {
  const f = 1/Math.tan(fovY/2);
  return new Float32Array([f/aspect,0,0,0, 0,f,0,0, 0,0,(far+near)/(near-far),-1, 0,0,(2*far*near)/(near-far),0]);
}
function rotY(a){const c=Math.cos(a),s=Math.sin(a);return new Float32Array([c,0,-s,0, 0,1,0,0, s,0,c,0, 0,0,0,1]);}
function inv(m){ // reuse the module's own inverse via invViewProj? simpler: identity view
  return m; }

const results = { compiled: [], failed: [] };
const cvHost = document.getElementById('cv');

const canvas = document.createElement('canvas');
canvas.width = 512; canvas.height = 256;
const gl = canvas.getContext('webgl2', { antialias:false, depth:false });
if (!gl) { say('NO WEBGL2'); throw new Error('no gl'); }

// Shared setup
const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);

let eyeProg;
try { eyeProg = link(gl, QUAD_VERT, EYE_FRAG); say('eye program: OK'); }
catch (e) { say('eye program FAILED:\n' + e.message); throw e; }

let FW = 1024, FH = 512;
const fieldTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, fieldTex);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,FW,FH,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
const fbo = gl.createFramebuffer();
gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, fieldTex, 0);
gl.bindFramebuffer(gl.FRAMEBUFFER, null);

const blank = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, blank);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0,255]));

function drawTri(){ gl.bindBuffer(gl.ARRAY_BUFFER, quad); gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0); gl.drawArrays(gl.TRIANGLES,0,3); }

function renderField(prog, t, u) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.viewport(0,0,FW,FH); gl.useProgram(prog);
  const U = n => gl.getUniformLocation(prog, n);
  gl.uniform3f(U('iResolution'), FW, FH, 1);
  gl.uniform1f(U('iTime'), t); gl.uniform1f(U('iTimeDelta'), 0.05);
  gl.uniform1i(U('iFrame'), Math.round(t*20)); gl.uniform4f(U('iMouse'),0,0,0,0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, blank); gl.uniform1i(U('iChannel0'),1);
  gl.uniform1f(U('iBass'),0); gl.uniform1f(U('iMid'),0); gl.uniform1f(U('iTreble'),0); gl.uniform1f(U('iLevel'),0);
  gl.uniform1f(U('iParam0'),u[0]); gl.uniform1f(U('iParam1'),u[1]);
  gl.uniform1f(U('iParam2'),u[2]); gl.uniform1f(U('iParam3'),u[3]);
  drawTri();
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

function renderEye(yaw) {
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.useProgram(eyeProg);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fieldTex);
  gl.uniform1i(gl.getUniformLocation(eyeProg,'uField'),0);
  // view matrix = inverse(head pose); pass world-to-view directly as "transform.inverse.matrix"
  const c=Math.cos(-yaw), s=Math.sin(-yaw);
  const viewInverse = new Float32Array([c,0,-s,0, 0,1,0,0, s,0,c,0, 0,0,0,1]);
  gl.uniformMatrix4fv(gl.getUniformLocation(eyeProg,'uInvViewProj'), false,
    invViewProj(persp(Math.PI/2, canvas.width/canvas.height, 0.1, 100), viewInverse));
  gl.uniform1f(gl.getUniformLocation(eyeProg,'uFloor'), 0.02);
  gl.uniform1f(gl.getUniformLocation(eyeProg,'uDim'), HEADSET_DIM);
  drawTri();
}

let px = new Uint8Array(canvas.width*canvas.height*4);
function stats() {
  if (px.length !== canvas.width*canvas.height*4) px = new Uint8Array(canvas.width*canvas.height*4);
  gl.readPixels(0,0,canvas.width,canvas.height,gl.RGBA,gl.UNSIGNED_BYTE,px);
  let sum=0, min=255, max=0, nonzero=0;
  for (let i=0;i<px.length;i+=4){
    const l = 0.2126*px[i] + 0.7152*px[i+1] + 0.0722*px[i+2];
    sum+=l; if(l<min)min=l; if(l>max)max=l; if(l>2)nonzero++;
  }
  const n = px.length/4;
  return { mean: sum/n/255, min: min/255, max: max/255, coverage: nonzero/n };
}

const uni = [0.5, 0.4, 0.8, 0.0];
for (const sh of STILLNESS_SHADERS) {
  let prog;
  try { prog = link(gl, QUAD_VERT, fieldProgramSource(sh.src)); }
  catch (e) { results.failed.push(sh.id); say(`✖ ${sh.id}: ${e.message.slice(0,300)}`); continue; }
  results.compiled.push(sh.id);
  renderField(prog, 12.0, uni);
  renderEye(0.0);
  const a = stats();
  renderEye(1.2);           // a head turn must change the picture
  const b = stats();
  const moved = Math.abs(a.mean - b.mean) + Math.abs(a.max - b.max);
  say(`✔ ${sh.id.padEnd(18)} mean ${a.mean.toFixed(3)}  max ${a.max.toFixed(3)}  cover ${(a.coverage*100).toFixed(0)}%  Δturn ${moved.toFixed(4)}`);
  const c2 = document.createElement('canvas'); c2.width=256; c2.height=128;
  renderEye(0.0);
  c2.getContext('2d').drawImage(canvas,0,0,256,128);
  cvHost.appendChild(c2);
  gl.deleteProgram(prog);
}
say(`\ncompiled ${results.compiled.length}/${STILLNESS_SHADERS.length}  failed: ${results.failed.join(',')||'none'}`);

// -- The safety gate, at the HEADSET's field rate --------------------------
// The flat screen samples the field 60 times a second; the headset samples it 20. Same
// underlying signal, three times coarser steps -- so a luminance change that was spread over
// three frames now lands in one. Harding/ITU-R BT.1702 counts a transition as a flash only if
// it exceeds 10% of full scale, and allows at most three a second.
say('');
say('-- luminance, sampled at the headset field rate --');
const HZ = XR_COMFORT.fieldHz;
const DUR = 20 * 60;
// Mean luminance is a whole-frame average, so the sweep can read a much smaller eye than the
// one a headset draws. readPixels is a synchronous stall; at 24,000 samples that is the entire
// cost of this measurement.
canvas.width = 128; canvas.height = 64;
// And a smaller field. The field is low spatial frequency by construction, so its mean
// luminance barely moves with resolution -- but a marching shader at 1024x512 is most of the
// cost of 24,000 samples.
FW = 512; FH = 256;
gl.bindTexture(gl.TEXTURE_2D, fieldTex);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,FW,FH,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
const sess = createSession({ seed: 0xA17C3F02, durationSec: DUR, arrival: 3 });
const sampler = new StillnessDriverSampler();
let worst = { d: 0, at: 0, id: '' }, flashes = 0, steps = 0;
let prevPhase = '', fprog = null, prevMean = null; const tally = [];
for (let t = 0; t < DUR; t += 1 / HZ) {
  const st = sess.at(t);
  sampler.update(st, t * 1000);
  if (st.phase !== prevPhase) {
    prevPhase = st.phase;
    if (fprog) gl.deleteProgram(fprog);
    fprog = link(gl, QUAD_VERT, fieldProgramSource(shaderForPhase(st.phase, sess.seed).src));
    prevMean = null;
  }
  const u = sampler.uniforms();
  renderField(fprog, t, [u.uBreath, u.uDepth, u.uCalm, u.uBloom]);
  renderEye(0.0);
  const m = stats().mean;
  if (prevMean !== null) {
    const d = Math.abs(m - prevMean);
    steps++;
    if (d > worst.d) worst = { d, at: t, id: st.phase };
    if (d > 0.10) { flashes++; tally.push(t); }
  }
  prevMean = m;
  // Yield periodically. A 24,000-step synchronous loop locks the renderer hard enough that the
  // page cannot even be read from the outside.
  if (steps % 200 === 0) {
    await new Promise(r => setTimeout(r, 0));
    if (steps % 2000 === 0) say('  ' + Math.round(t) + '/' + DUR + 's  worst so far ' + worst.d.toFixed(4));
  }
}
let peakPerSec = 0;
for (const t of tally) peakPerSec = Math.max(peakPerSec, tally.filter(x => x >= t && x < t + 1).length);
say('steps ' + steps + ' at ' + HZ + ' Hz over ' + DUR + 's');
say('largest single-step luminance change: ' + worst.d.toFixed(4) + ' (' + (worst.d*100).toFixed(2) + '% of full scale) in ' + worst.id + ' at ' + worst.at.toFixed(1) + 's');
say('transitions over the 10% flash threshold: ' + flashes + '  -- worst second: ' + peakPerSec + ' (limit 3)');
say(flashes === 0 ? 'PASS -- nothing in the session qualifies as a flash at all' : (peakPerSec <= 3 ? 'PASS -- under the three-per-second limit' : 'FAIL'));
canvas.width = 512; canvas.height = 256;
window.__XRBENCH = Object.assign({}, results, { worst: worst, flashes: flashes, peakPerSec: peakPerSec, done: true });
</script></body></html>

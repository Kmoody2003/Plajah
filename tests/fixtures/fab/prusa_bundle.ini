infill_speed = 80
solid_infill_speed = 50%
travel_speed = 180
first_layer_speed = 20
seam_position = aligned
support_material = 0
skirts = 1
brim_width = 0

[print:0.20mm QUALITY @MK3]
inherits = *common*
layer_height = 0.2
fill_density = 20%
fill_pattern = cubic
seam_position = rear
ironing = 1
ironing_type = top
ironing_speed = 15
ironing_flowrate = 15%
ironing_spacing = 0.1
support_material = 1
support_material_auto = 1
support_material_buildplate_only = 1
support_material_style = organic
support_material_threshold = 55
max_volumetric_speed = 11

[filament:*PET*]
filament_type = PETG
filament_diameter = 1.75
filament_density = 1.27
temperature = 240
first_layer_temperature = 230
bed_temperature = 90
first_layer_bed_temperature = 85
max_fan_speed = 50
disable_fan_first_layers = 3
filament_max_volumetric_speed = 8
filament_retract_length = 1
start_filament_gcode = "M900 K0.08 ; Filament gcode"

[filament:Prusament PETG]
inherits = *PET*
filament_max_volumetric_speed = 8

[printer:*common*]
gcode_flavor = marlin2
bed_shape = 0x0,250x0,250x210,0x210
max_print_height = 210
nozzle_diameter = 0.4
retract_length = 0.8
retract_speed = 35
retract_lift = 0.4
machine_max_feedrate_x = 200,100
machine_max_feedrate_y = 200,100
machine_max_acceleration_extruding = 1250,1250
start_gcode = M862.3 P "[printer_model]" ; printer model check\nM115 U3.13.2\nM140 S[first_layer_bed_temperature] ; set bed temp\nM104 S[first_layer_temperature] ; set extruder temp\nG28 W ; home all without mesh bed level\nM190 S[first_layer_bed_temperature] ; wait for bed temp\nM109 S[first_layer_temperature] ; wait for extruder temp\nG80 ; mesh bed leveling\n{if filament_type[0]=="PETG"}M221 S95{else}M221 S100{endif}\nG1 Y-3.0 F1000.0 ; go outside print area\nG92 E0
end_gcode = M104 S0 ; turn off temperature\nM140 S0 ; turn off heatbed\nM107 ; turn off fan\nG1 X0 Y200 F3000 ; home X axis\nM84 ; disable motors

[printer:Original Prusa i3 MK3S]
inherits = *common*
printer_model = MK3S

[presets]
print = 0.20mm QUALITY @MK3
filament = Prusament PETG
printer = Original Prusa i3 MK3S

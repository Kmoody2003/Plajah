# generated by PrusaSlicer 2.8.1 (test fixture written for Plajah Build; values are typical, not a vendor bundle)

[print:*common*]
layer_height = 0.15
first_layer_height = 0.2
perimeters = 2
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 15%
fill_pattern = gyroid
perimeter_speed = 45

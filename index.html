    <script>
      // ── "Log in with Audius" popup bridge ──────────────────────────────────
      // Audius sends the consent popup back to /audius/callback with ?code&state.
      // Hand them to the opener and close IMMEDIATELY — booting the whole app inside
      // a 420px popup just to read two query params would be slow and pointless.
      // (No opener = a full-page redirect: fall through and let completeAudiusRedirect()
      // in the app finish the exchange.)
      (function () {
        if (window.location.pathname !== '/audius/callback' || !window.opener) return;
        var q = new URLSearchParams(window.location.search);
        var h = new URLSearchParams(window.location.hash.replace(/^#/, ''));
        var get = function (k) { return q.get(k) || h.get(k); };
        var code = get('code'), state = get('state'), error = get('error');
        if (!code && !error) return;
        try {
          window.opener.postMessage({
            source: 'plajah-audius-oauth',
            code: code, state: state,
            error: error, error_description: get('error_description'),
          }, get('origin') || window.location.origin);
        } catch (e) { /* opener gone — nothing to do */ }
        window.close();
      })();
    </script>

    <!-- Pre-mount splash.
         #root was empty, so from first paint until the app bundle parsed there was nothing to
         look at — a white flash on every cold launch, worst on the TV APK, which is a thin shell
         over the live site and so pays a full network page load behind an already-dismissed
         native splash. This is plain inline markup with no bundle dependency, so it is on screen
         as soon as the HTML is parsed, and index.tsx removes it once React has mounted.
         The mark is components/Logo.tsx's chevron with --pj-grad-warm inlined (the gradient id is
         hardcoded because the React component derives its own with useId). -->
    <div id="pj-boot" role="status" aria-label="Loading Plajah">
      <svg viewBox="0 0 100 100" width="88" height="88" aria-hidden="true">
        <defs>

            <stop offset="50%" stop-color="#D40055"/>
            <stop offset="100%" stop-color="#FF8C00"/>

        </defs>
        <path d="M30 20 L70 50 L30 80" fill="none" stroke="url(#pjBootGrad)"
              stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div id="pj-boot-bar"><i></i></div>
    </div>

    <script>
      // rAF starvation guard: in never-painting webviews (headless previews,
      // some Android TV launchers, background-restored tabs) the compositor
      // never produces frames so requestAnimationFrame callbacks never run —
      // which silently stalls every library that schedules with it (epub.js
      // book rendering, motion exit animations). Install a wrapper BEFORE the
      // app modules load (they capture rAF at import time): it delegates to
      // the native rAF normally, and switches to 16ms timers only if a probe
      // frame hasn't fired shortly after boot.
      (function () {
        try {
          var native = window.requestAnimationFrame.bind(window);
          var nativeCancel = (window.cancelAnimationFrame || window.clearTimeout).bind(window);
          var starved = false;
          var probeFired = false;
          native(function () { probeFired = true; });
          setTimeout(function () {
            starved = !probeFired;
            if (starved) console.warn('[plajah] rAF starved — timer-based frames for this session.');
          }, 250);
          window.requestAnimationFrame = function (cb) {
            return starved
              ? window.setTimeout(function () { cb(performance.now()); }, 16)
              : native(cb);
          };
          window.cancelAnimationFrame = function (id) {
            nativeCancel(id);
            window.clearTimeout(id);
          };
        } catch (e) { /* leave native rAF untouched */ }
      })();
    </script>
    <script>
      // Galaxy Z Fold cover (outer) screen detection. The outer screen is
      // narrow + unusually tall (~21:9) and physically small/dense, so the
      // mobile layout renders too small. We key on window.screen (the physical
      // screen aspect) rather than the viewport — it's stable to the URL bar and
      // distinguishes the cover (≈0.428 narrow/tall) from normal phones (≈0.45+)
      // and the wide unfolded inner screen. Toggling on resize/orientation also
      // handles fold↔unfold (which fire resize). CSS in <style> does the scaling.
      (function() {
        function isCover() {
          try {
            var w = screen.width, h = screen.height;
            if (!w || !h) return false;
            var mn = Math.min(w, h), mx = Math.max(w, h);
            return mn <= 430 && (mn / mx) <= 0.44;
          } catch (e) { return false; }
        }
        window.__isCoverScreen = isCover;
        function apply() { document.documentElement.classList.toggle('zfold-cover', isCover()); }
        apply();
        window.addEventListener('resize', apply);
        window.addEventListener('orientationchange', apply);
      })();
    </script>
    <script>
      // Fix Android Chrome URL bar causing layout jumps.
      // Sets --real-vh so components can use calc(var(--real-vh) * 100)
      // instead of 100dvh, which reflows on every scroll. On the Z Fold cover
      // screen, #root is zoomed, so --real-vh is divided by the zoom factor to
      // keep --real-vh-based heights filling exactly one screen after zoom.
      (function() {
        function setVh() {
          var raw = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
          var z = (window.__isCoverScreen && window.__isCoverScreen())
            ? (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cover-zoom')) || 1.25)
            : 1;
          document.documentElement.style.setProperty('--real-vh', (raw / z) * 0.01 + 'px');
        }
        setVh();
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', setVh);
        } else {
          window.addEventListener('resize', setVh);
        }
        window.addEventListener('orientationchange', setVh);
      })();
    </script>

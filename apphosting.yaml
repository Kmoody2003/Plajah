    value: YOUR_STRIPE_MERCH_WEBHOOK_SECRET_HERE
    availability:
      - RUNTIME

  # ── Terra: Detroit parcel ingestion ──────────────────────────────────────────
  # Pulls the city's open parcel + civic records into the Terra spine.
  # Runs a small warm pass ~45s after boot, then a bounded pass every 24h.
  # Each bounded pass resumes from a persisted offset, so successive nights walk
  # the whole city (~378k parcels) and then wrap around to refresh it.
  # Set to "false" to stop the scheduler without redeploying code.
  - variable: TERRA_INGESTION_WORKER
    value: "true"
    availability:
      - RUNTIME
  # Parcels per scheduled pass. At 5000/night a full sweep takes ~11 weeks;
  # raise it to load faster, at the cost of a longer run and more Firestore
  # writes. A one-off full load is better done via POST /api/terra/ingest
  # with scope "deep", which pulls everything and resets the cursor.
  - variable: TERRA_INGESTION_MAX_PARCELS
    value: "5000"
    availability:
      - RUNTIME
  # Interval in ms between scheduled passes. Detroit publishes daily, so 24h is
  # the sensible floor — polling faster gains nothing and costs reads.
  # NOTE: this in-process timer is now only a fallback. On Cloud Run the container
  # scales to zero, so a 24h setInterval rarely survives long enough to fire; the
  # RELIABLE daily driver is Cloud Scheduler hitting POST /api/terra/cron/ingest.
  - variable: TERRA_INGESTION_INTERVAL_MS
    value: "86400000"
    availability:
      - RUNTIME
  # Shared secret that authenticates the Cloud Scheduler cron call to
  # POST /api/terra/cron/ingest (header `X-Terra-Cron-Key`). Stored in Secret
  # Manager, never in plaintext. Create it once with:
  #   firebase apphosting:secrets:set TERRA_CRON_KEY
  # then grant the backend access when prompted. Rotate by re-running set.
  - variable: TERRA_CRON_KEY
    secret: TERRA_CRON_KEY
    availability:
      - RUNTIME
name: Secret scan

# gitleaks on every PR and push to master. Scans the commits in the PR / push range (not the
# whole history) so a historical, already-rotated key doesn't fail every run. To audit full
# history once, run locally:  gitleaks detect --source . --log-opts="--all"
# Note: gitleaks-action is free for personal accounts; a GitHub *organization* needs a free
# GITLEAKS_LICENSE secret (https://gitleaks.io).

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

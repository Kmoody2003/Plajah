name: Preview Deploy on PR

on:
  pull_request:

permissions:
  checks: write
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy preview channel
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0665118474 }}
        run: |
          echo "$FIREBASE_SA" > /tmp/firebase-sa.json
          PREVIEW_URL=$(GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json \
            npx firebase-tools hosting:channel:deploy "pr-${{ github.event.number }}" \
              --project gen-lang-client-0665118474 \
              --expires 7d \
              --json | jq -r '.result["gen-lang-client-0665118474"].url')
          rm -f /tmp/firebase-sa.json
          echo "PREVIEW_URL=$PREVIEW_URL" >> $GITHUB_ENV

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            if (!url) return;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🔥 **Firebase Preview:** ${url}\n\nExpires in 7 days.`
            });

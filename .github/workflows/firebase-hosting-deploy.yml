name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 20 LTS for the firebase deploy: Node 24's undici keep-alive triggers
      # "premature close" retries against Google APIs, and the retry of the non-idempotent
      # Hosting release POST then 400s as "already the current active version" (the first
      # POST actually succeeded). Node 20 avoids the premature-close churn.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_MUX_TOKEN_ID: ${{ secrets.VITE_MUX_TOKEN_ID }}
          VITE_MUX_TOKEN_SECRET: ${{ secrets.VITE_MUX_TOKEN_SECRET }}
        run: npm run build

      # Official Firebase action — bundles a known-good firebase-tools and wires the
      # service-account auth correctly (current firebase-tools regressed on honoring
      # GOOGLE_APPLICATION_CREDENTIALS, which caused "Failed to authenticate").
      - name: Deploy Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0665118474 }}
          projectId: gen-lang-client-0665118474
          channelId: live

      # Firestore rules — non-blocking; firebase-tools auth (GOOGLE_APPLICATION_CREDENTIALS)
      # is unreliable on current versions, so rules are also deployable manually with
      # `firebase deploy --only firestore`. Kept here best-effort.
      - name: Deploy Firestore rules
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-sa.json
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0665118474 }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase-tools@13.35.1 deploy --only firestore --project gen-lang-client-0665118474 --non-interactive --force

  # ── API backend (server.ts) → Cloud Run ──────────────────────────────────────
  deploy_api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build SPA (Dockerfile copies the prebuilt dist/)
        env:
          VITE_MUX_TOKEN_ID: ${{ secrets.VITE_MUX_TOKEN_ID }}
          VITE_MUX_TOKEN_SECRET: ${{ secrets.VITE_MUX_TOKEN_SECRET }}
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0665118474 }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy server.ts to Cloud Run
        run: |
          gcloud run deploy plajah-api \
            --source . \
            --project gen-lang-client-0665118474 \
            --region us-west1 \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --timeout 300 \
            --update-env-vars NODE_ENV=production,VITE_FIREBASE_DB_ID=plajah-prod,VITE_FIREBASE_PROJECT_ID=gen-lang-client-0665118474

name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

# Opt into Node.js 24 for action runners now so GitHub's forced cutover
# (June 16 2026) doesn't break the git credential helper mid-flight.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_MUX_TOKEN_ID: ${{ secrets.VITE_MUX_TOKEN_ID }}
          VITE_MUX_TOKEN_SECRET: ${{ secrets.VITE_MUX_TOKEN_SECRET }}
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0665118474 }}

      - name: Deploy Firebase Hosting
        run: npx firebase-tools deploy --only hosting --project gen-lang-client-0665118474 --force

      - name: Deploy Firestore rules
        continue-on-error: true
        run: npx firebase-tools deploy --only firestore:rules --project gen-lang-client-0665118474 --force

name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_MUX_TOKEN_ID: ${{ secrets.VITE_MUX_TOKEN_ID }}
          VITE_MUX_TOKEN_SECRET: ${{ secrets.VITE_MUX_TOKEN_SECRET }}
        run: npm run build

      - name: Deploy Firebase Hosting
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0665118474 }}
        run: |
          echo "$FIREBASE_SA" > /tmp/firebase-sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json npx firebase-tools deploy \
            --only hosting \
            --project gen-lang-client-0665118474 \
            --force
          rm -f /tmp/firebase-sa.json

      - name: Deploy Firestore rules
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0665118474 }}
        continue-on-error: true
        run: |
          echo "$FIREBASE_SA" > /tmp/firebase-sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json npx firebase-tools deploy \
            --only firestore:rules \
            --project gen-lang-client-0665118474 \
            --force
          rm -f /tmp/firebase-sa.json

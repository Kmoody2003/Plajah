name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 20 LTS for the firebase deploy: Node 24's undici keep-alive triggers
      # "premature close" retries against Google APIs, and the retry of the non-idempotent
      # Hosting release POST then 400s as "already the current active version" (the first
      # POST actually succeeded). Node 20 avoids the premature-close churn.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # The bundle includes verovio's embedded WASM + onnxruntime — the default Node
          # heap OOMs during the build, so give it plenty of headroom (runner has 16 GB).
          NODE_OPTIONS: --max-old-space-size=8192
          VITE_MUX_TOKEN_ID: ${{ secrets.VITE_MUX_TOKEN_ID }}
          VITE_MUX_TOKEN_SECRET: ${{ secrets.VITE_MUX_TOKEN_SECRET }}
          # App Check site key — without this the client sends no App Check token; if App Check
          # enforcement is ON for Storage in the Firebase console, every upload is denied.
          VITE_APPCHECK_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_APPCHECK_RECAPTCHA_SITE_KEY }}
          # Open-access artifact browsers (Archaeology + World History). Optional — the
          # browser works on keyless sources without these; they light up the Smithsonian
          # and Europeana sources when the secrets are set.
          VITE_SMITHSONIAN_KEY: ${{ secrets.VITE_SMITHSONIAN_KEY }}
          VITE_EUROPEANA_KEY: ${{ secrets.VITE_EUROPEANA_KEY }}
        run: npm run build

      # Official Firebase action — bundles a known-good firebase-tools and wires the
      # service-account auth correctly (current firebase-tools regressed on honoring
      # GOOGLE_APPLICATION_CREDENTIALS, which caused "Failed to authenticate").
      - name: Deploy Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0665118474 }}
          projectId: gen-lang-client-0665118474
          channelId: live

      # Firestore + Storage rules are deployed by the dedicated `deploy_rules` job
      # below — a HARD-FAILING, verified step. (This used to be a best-effort
      # continue-on-error step here; a silent failure once left production on
      # months-old Storage rules and denied every upload. Never again.)

  # ── Firestore + Storage rules → Firebase ──────────────────────────────────────
  # Its own job so it can NEVER ship silently: reliable SA auth (the same path the
  # Cloud Run job uses — unlike the old hand-written GOOGLE_APPLICATION_CREDENTIALS
  # file that firebase-tools mishandled), no continue-on-error, and a post-deploy
  # verification that reads the live rules back. A failed or no-op rules deploy now
  # turns the build red.
  deploy_rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0665118474 }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      # firebase-tools authenticates via the ADC the auth step exported
      # (GOOGLE_APPLICATION_CREDENTIALS). storage MUST be included — uploads
      # (UploadContext → uploads/<type>s/…) are denied by the default fallback
      # unless storage.rules is live.
      # firestore.rules (commented source, ~295 KiB) is over Firebase's 256 KiB ruleset limit, which
      # failed every rules deploy with "HTTP 400 invalid argument". Deploy the comment-stripped build
      # (firebase.json → firestore.rules.min). Fails here if it's ever over the limit again.
      - name: Build minified Firestore rules
        run: |
          node scripts/minifyRules.mjs firestore.rules firestore.rules.min
          node scripts/minifyRules.mjs firestore.ops.rules firestore.ops.rules.min

      # Firebase caps the COMPILED ruleset at 256,000 bytes, separate from the source limit the minifier
      # checks, and over it `firebase deploy` reports a misleading 409. Probe a throwaway release first
      # so an oversized ruleset fails here with the real byte count.
      - name: Probe compiled Firestore rules size
        run: |
          export RULES_ACCESS_TOKEN=$(gcloud auth print-access-token)
          node scripts/probeRuleset.mjs firestore.rules.min
          node scripts/probeRuleset.mjs firestore.ops.rules.min
          # Back-office access must resolve through the mirrors, and the mirrors must stay closed to clients.
          node scripts/testOpsRules.mjs firestore.ops.rules.min

      - name: Deploy Firestore + Storage rules
        run: npx firebase-tools@13.35.1 deploy --only firestore,storage --project gen-lang-client-0665118474 --non-interactive --force

      # Prove the Firestore deploy landed: each database's live ruleset must be exactly the file we built
      # (plajah-prod = firestore.rules.min, plajah-ops = firestore.ops.rules.min — see services/opsCollections.ts).
      - name: Verify live Firestore rules are current
        run: |
          set -euo pipefail
          PROJECT=gen-lang-client-0665118474
          TOKEN=$(gcloud auth print-access-token)
          RELEASES=$(curl -sf -H "Authorization: Bearer $TOKEN" -H "x-goog-user-project: $PROJECT" "https://firebaserules.googleapis.com/v1/projects/$PROJECT/releases")
          for pair in plajah-prod:firestore.rules.min plajah-ops:firestore.ops.rules.min; do
            DB=${pair%%:*}; FILE=${pair#*:}
            RULESET=$(echo "$RELEASES" | python3 -c "import sys,json;d=json.load(sys.stdin);print(next(r['rulesetName'] for r in d['releases'] if r['name'].endswith('/cloud.firestore/$DB')))")
            curl -sf -H "Authorization: Bearer $TOKEN" -H "x-goog-user-project: $PROJECT" "https://firebaserules.googleapis.com/v1/$RULESET"               | python3 -c "import sys,json;sys.stdout.write(json.load(sys.stdin)['source']['files'][0]['content'])" > live.rules
            if ! cmp -s live.rules "$FILE"; then
              echo "::error::Live Firestore rules ($DB) differ from $FILE — the deploy did not land."
              exit 1
            fi
            echo "Live Firestore rules verified: $DB identical to $FILE."
          done

      # Read the live Storage ruleset back and assert the uploads/** rule is present.
      # This is the guard the old setup lacked: it proves the deploy actually landed,
      # so the exact stale-rules regression that broke uploads can't recur unnoticed.
      - name: Verify live Storage rules are current
        run: |
          set -euo pipefail
          PROJECT=gen-lang-client-0665118474
          TOKEN=$(gcloud auth print-access-token)
          RULESET=$(curl -sf -H "Authorization: Bearer $TOKEN" -H "x-goog-user-project: $PROJECT" \
            "https://firebaserules.googleapis.com/v1/projects/$PROJECT/releases" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(next(r['rulesetName'] for r in d['releases'] if 'firebase.storage' in r['name']))")
          CONTENT=$(curl -sf -H "Authorization: Bearer $TOKEN" -H "x-goog-user-project: $PROJECT" \
            "https://firebaserules.googleapis.com/v1/$RULESET" \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['source']['files'][0]['content'])")
          if ! echo "$CONTENT" | grep -q "match /uploads/"; then
            echo "::error::Live Storage rules are MISSING the uploads/** rule — the deploy did not land. Uploads would be denied."
            exit 1
          fi
          echo "Live Storage rules verified: uploads/** rule is present."

  # ── API backend (server.ts) → Cloud Run ──────────────────────────────────────
  deploy_api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Replaces Artifact Analysis scanning, which was disabled on the
      # cloud-run-source-deploy repo (it billed $0.26 per push at ~17 deploys/day for
      # ~$130/month to re-scan near-identical images). See infra/README.md.
      #
      # HARD-FAILING, deliberately: `npm audit fix` cleared all 3 critical production
      # advisories on 2026-08-13, so this passes clean today and a red build means a NEW
      # critical actually landed. Scoped to --omit=dev (build tooling isn't shipped) and
      # --audit-level=critical (high/moderate would be too noisy to ever stay green, and a
      # gate nobody can keep green gets disabled, which is worse than no gate).
      - name: Dependency audit (production deps, critical only)
        run: npm audit --omit=dev --audit-level=critical

      - name: Build SPA (Dockerfile copies the prebuilt dist/)
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VITE_MUX_TOKEN_ID: ${{ secrets.VITE_MUX_TOKEN_ID }}
          VITE_MUX_TOKEN_SECRET: ${{ secrets.VITE_MUX_TOKEN_SECRET }}
          VITE_APPCHECK_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_APPCHECK_RECAPTCHA_SITE_KEY }}
          VITE_SMITHSONIAN_KEY: ${{ secrets.VITE_SMITHSONIAN_KEY }}
          VITE_EUROPEANA_KEY: ${{ secrets.VITE_EUROPEANA_KEY }}
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0665118474 }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy server.ts to Cloud Run
        run: |
          # Source builds were running ~29 min against Cloud Build's 30-min default and started
          # timing out (DEADLINE_EXCEEDED, 2026-10-17). The Dockerfile no longer duplicates the
          # image with `chown -R`; this is headroom on top of that fix.
          gcloud config set builds/timeout 3600
          gcloud run deploy plajah-api \
            --source . \
            --project gen-lang-client-0665118474 \
            --region us-west1 \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 2Gi \
            --cpu 2 \
            --cpu-boost \
            --timeout 3600 \
            --update-env-vars NODE_ENV=production,VITE_FIREBASE_DB_ID=plajah-prod,VITE_FIREBASE_PROJECT_ID=gen-lang-client-0665118474
        # --timeout 3600: the Reello Live → Mux relay is a WebSocket held for the whole broadcast, and Cloud Run
        # cuts any request at --timeout (300 s dropped every relay at 5 min). The client reconnects at the cap;
        # Mux's reconnect_window keeps it one continuous live (services/liveMuxRelayServer.ts).
        # ↑ The server transpiles ~6k lines via tsx at boot; on 1 vCPU that raced the Cloud Run
        # startup health-check and the revision was killed as "failed to start in time". More CPU +
        # startup CPU boost + memory headroom lets it bind $PORT well inside the window.

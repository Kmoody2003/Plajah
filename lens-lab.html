<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lens Lab</title>
<style>
  body{margin:0;background:#0d0d14;color:#fff;font:14px system-ui;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px}
  h1{font-size:16px;margin:0;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
  #stage{position:relative;width:min(92vw,405px);aspect-ratio:9/16;background:#000;border-radius:16px;overflow:hidden}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:640px}
  button{border:0;border-radius:12px;padding:10px 14px;font:600 14px system-ui;color:#fff;background:#262634;cursor:pointer}
  button.on{background:#ff8c00;color:#000}
  #diag{font:11px ui-monospace,monospace;opacity:.55;text-align:center;max-width:90vw;min-height:1.4em}
  #err{color:#ff9d9d;max-width:90vw;text-align:center}
</style></head>
<body>
  <h1>Plajah · Lens Lab</h1>
  <div id="stage"><video id="out" autoplay playsinline muted></video></div>
  <div class="row" id="lenses"></div>
  <div class="row" id="looks"></div>
  <div class="row"><button id="mirror" class="on">Mirror preview</button></div>
  <div id="diag">starting camera…</div>
  <div id="err"></div>
  <script type="module" src="/lens-lab.ts"></script>
</body></html>
